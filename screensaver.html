<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スクリーンセーバー｜第1回関西SA DJフェス</title>
  <meta name="description" content="第1回関西SA DJフェス（9/25(金) 19:00〜22:00 ネイバーズ江坂 1st）の全画面スクリーンセーバー。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;700&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/screensaver.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      cursor: none;
      font-family: 'Noto Sans JP', sans-serif;
      background: #fff6e2;
    }

    .saver-fireworks {
      position: absolute;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .saver-hint {
      position: fixed;
      top: 62px;
      right: 22px;
      z-index: 3;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: rgba(36, 26, 18, 0.5);
    }
  </style>
</head>
<body>
  <div class="saver" data-saver data-saver-exit="index.html">
    <canvas class="saver-fireworks" data-fireworks aria-hidden="true"></canvas>
  </div>
  <p class="saver-hint">クリックまたはキー操作で告知ページへ</p>
  <script src="js/screensaver.js"></script>
  <script src="js/fireworks.js"></script>
</body>
</html>
